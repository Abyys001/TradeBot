# Production stack for a fresh VPS. Owns ports 80/443, terminates TLS (Caddy
# auto-provisions from Let's Encrypt for SITE_DOMAIN), and serves the panel
# from a built Nuxt bundle instead of `nuxt dev`. No host ports are published
# except Caddy's — backend and panel are reachable only over the Docker
# network, so the backend is never directly addressable from outside.
#
#   cp .env.production.example .env      # then fill the change-me values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Full runbook in docs/deploy.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walletmanager}
      POSTGRES_USER: ${POSTGRES_USER:-walletmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-walletmanager}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: >
      sh -c "python manage.py wait_for_db --timeout 30 &&
             python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: [.env]
    environment:
      # Pinned for the same reason the dev compose pins them: a dev .env pasted
      # here would otherwise quietly fall back to SQLite + in-memory channels.
      USE_SQLITE: "false"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # False so the healthcheck below (plain HTTP on the docker network, no
      # X-Forwarded-Proto) gets a 200 instead of a 301. Browsers never reach
      # Django over plaintext: Caddy/nginx terminate TLS and forward
      # X-Forwarded-Proto: https, which is what the redirect would be for.
      DJANGO_SECURE_SSL_REDIRECT: "false"
    expose: ["8000"]
    # Not decoration: without it Caddy and the panel start against a backend
    # that is still running collectstatic and migrate on first boot, and the
    # first thing anyone sees is a 502 they then go looking for a cause for.
    # The endpoint proves Postgres and Redis actually answer, not merely that
    # the process is listening. `start_period` covers that first migrate.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Keeps the platform's record and the exchanges' positions in agreement even
  # when no panel is open: a stop that fires at 3am has to free the account for
  # the next trade whether or not anyone is watching, and a position the venue
  # holds that this platform lost track of has to surface without waiting for
  # someone to log in. Read-only against the exchanges (get_position); it never
  # places, amends, or cancels an order. The same sweep runs inline on every
  # /positions/ poll, so this service being down costs latency, not accuracy.
  possync:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: python manage.py sync_positions
    env_file: [.env]
    environment:
      USE_SQLITE: "false"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      # apiProxyTarget is read at runtime (server-side config), so it lives here.
      NUXT_API_PROXY_TARGET: http://backend:8000/api
      # Where the panel's own WebSocket relay forwards to. Caddy short-circuits
      # /ws straight to Channels in this stack, so the relay is the fallback
      # path rather than the usual one — but it must still be pointed at the
      # backend, or a deployment that fronts this service with something other
      # than the bundled Caddyfile has no working live channel.
      NUXT_WS_PROXY_TARGET: ws://backend:8000
      # NUXT_PUBLIC_WS_BASE is deliberately unset: the panel derives a
      # same-origin wss:// URL from location.host. Setting it would hardcode
      # the domain into the deployment for no gain.
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Wait for a backend that actually answers, not one that has merely
    # started: the panel proxies /api and its first render asks for a session.
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: [.env]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # backend as well as frontend: Caddy terminates /ws itself and forwards it
    # to Channels, so it now has two upstreams rather than one.
    depends_on: [frontend, backend]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
