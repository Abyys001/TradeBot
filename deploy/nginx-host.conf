# The live front for maxbot.cybercina.co.uk — host nginx, TLS from certbot.
#
# This is the file that is actually installed at
# /etc/nginx/sites-available/maxbot.cybercina.co.uk. It lived only on the
# server until now, which meant the one config the public hits was the one
# config nobody could review or roll back. Install it with deploy/install-nginx.sh.
#
# Routing mirrors the bundled Caddyfile:
#
#   /ws/*  -> 127.0.0.1:8001   straight to Channels, upgrade intact
#   /api/* -> 127.0.0.1:3000   the panel proxies these on to the backend itself
#   /*     -> 127.0.0.1:3000   the built Nuxt server
#
# --- Why the error_page blocks exist -------------------------------------
# `docker compose up -d --build` stops the old containers before the new ones
# answer, and frontend waits on backend's healthcheck before it starts at all.
# For 30-120 seconds nothing is listening on :3000, and nginx's own answer to
# that is a bare "502 Bad Gateway" — which is what "the website isn't loading"
# looked like on 23, 25, 26 Aug and 31 Aug, 3 Sep and 4 Sep. A deploy is not an
# outage and must not render as one, so a refused upstream now serves a page
# that says what is happening and reloads itself when the swap finishes.
#
# `proxy_intercept_errors` is deliberately left OFF. These blocks catch only
# errors nginx generates because it could not reach the upstream. A 503 the
# application itself returns — "no price feed" is a real one — passes straight
# through, because replacing it would hide the one thing it exists to say.

server {
    server_name maxbot.cybercina.co.uk;

    # --- The live channel: straight to Channels, relay bypassed ---
    # nginx hands the Upgrade to Daphne directly — one hop fewer than going
    # through the Nuxt relay, and the path the production Caddyfile uses.
    # proxy_read_timeout 3600s covers throttled background tabs that pause
    # the 8 s keepalive beyond nginx's 60 s default.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- The panel's API, which must stay JSON even while it is down ---
    # The store layer parses every one of these. Handing it the maintenance
    # HTML would surface as a parse error instead of "the panel is restarting",
    # so this branch answers in the shape the caller already expects.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        error_page 502 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"The panel is restarting. Nothing here is a current reading."}';
    }

    # --- Everything else: built Nuxt panel ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 2s;
        error_page 502 504 = @deploying;
    }

    # 503 rather than the original 502: a swap is "come back shortly", and
    # Retry-After is the header that says so to anything that is not a browser.
    location @deploying {
        return 503;
    }

    # Two error_page hops (502 -> @deploying -> 503 -> the file) is one more
    # than nginx follows by default; without this the browser gets nginx's own
    # grey 503 instead of the page. The chain is depth 2 and ends on a static
    # internal file, so there is nothing here to loop on.
    recursive_error_pages on;
    error_page 503 /__maintenance.html;

    location = /__maintenance.html {
        internal;
        root /var/www/maxbot;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/maxbot.cybercina.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxbot.cybercina.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;
}

server {
    if ($host = maxbot.cybercina.co.uk) {
        return 301 https://$host$request_uri;
    }

    server_name maxbot.cybercina.co.uk;

    listen 80;
    return 404;
}
