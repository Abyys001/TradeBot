# Reference nginx front for the launch stack — a drop-in for the bundled
# Caddyfile when the VPS runs nginx instead. Mirrors Caddyfile exactly:
#
#   /ws/*  -> backend:8000   straight to Channels, upgrade intact
#   /*     -> frontend:3000  the built Nuxt server, which proxies /api itself
#
# The /ws split is the whole point. A plain `proxy_pass` without the two
# upgrade headers hands Channels a request whose handshake never arrived, and
# the browser's socket sits on "connecting" while both latency readings on
# Settings -> Connection & data stay blank. Nothing on the nitro side can
# carry an upgrade either (routeRules[].proxy is an h3 proxyRequest that
# drops it) — only a proxy in front that forwards `Upgrade` works.
#
# Usage with the prod compose network (recommended):
#
#   services:
#     proxy:
#       image: nginx:1.27-alpine
#       ports: ["80:80", "443:443"]
#       volumes:
#         - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
#         - ./deploy/tls:/etc/nginx/tls:ro
#       depends_on: [backend, frontend]
#
# Running nginx on the host instead: give backend/frontend host-published
# ports in the compose (`ports: ["8000:8000"]` / `["3000:3000"]`) and change
# the two `proxy_pass` upstream names to `127.0.0.1:8000` / `127.0.0.1:3000`.
#
# TLS is layered on underneath certbot (uncomment the 443 block) or in front —
# this file is only about routing.

events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # Service names resolve on the compose network. Swap for 127.0.0.1:PORT
    # when nginx runs on the host.
    upstream panel_backend { server backend:8000; }
    upstream panel_frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # --- The live channel -------------------------------------------------
        # Must reach daphne with the handshake intact. The upgrade headers are
        # what nginx normally strips; keep them, force HTTP/1.1 (HTTP/2 does
        # not speak WebSocket), and never let an idle socket be reaped early.
        location /ws/ {
            proxy_pass http://panel_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # --- Everything else ---------------------------------------------------
        # Pages, /_nuxt/**, /api/** — the panel's own proxy handles /api to the
        # backend using NUXT_API_PROXY_TARGET. A plain HTTP proxy_pass would
        # work for these, but the upgrade headers are harmless to carry and
        # mean the panel's own relay (frontend/server/routes/ws/[...].ts) stays
        # usable as the fallback path.
        location / {
            proxy_pass http://panel_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
