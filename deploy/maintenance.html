<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- The panel is being replaced. Come back on our own, so the operator does
     not have to sit on F5 to find out when the deploy finished. -->
<meta http-equiv="refresh" content="5">
<title>TradeBot — updating</title>
<style>
  :root {
    color-scheme: dark;
    --c-base: 7 9 12;
    --c-panel: 14 17 22;
    --c-line: 30 36 45;
    --c-ink: 232 236 242;
    --c-ink-muted: 152 162 179;
    --c-ink-faint: 98 108 124;
    --c-brand: 124 156 255;
    --c-signal: 240 160 32;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgb(var(--c-base));
    color: rgb(var(--c-ink));
    font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgb(var(--c-panel));
    border: 1px solid rgb(var(--c-line));
    border-radius: 14px;
    padding: 32px;
    text-align: center;
  }
  .pulse {
    width: 40px; height: 40px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 2px solid rgb(var(--c-brand) / 0.25);
    border-top-color: rgb(var(--c-brand));
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; border-top-color: rgb(var(--c-brand) / 0.25); }
  }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  p  { margin: 0; color: rgb(var(--c-ink-muted)); }
  .fa { margin-top: 6px; direction: rtl; }
  .note {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgb(var(--c-line));
    color: rgb(var(--c-ink-faint));
    font-size: 12.5px;
  }
  .halt { color: rgb(var(--c-signal)); }
</style>
</head>
<body>
  <main class="card">
    <div class="pulse" aria-hidden="true"></div>
    <h1>The panel is updating</h1>
    <p>This page reloads by itself. No action is needed.</p>
    <p class="fa">پنل در حال به‌روزرسانی است. این صفحه خودکار بارگذاری می‌شود.</p>
    <p class="note">
      Open positions are untouched — they live on the exchanges, not here, and
      <span class="halt">stops and take-profits already sitting on a venue keep
      working</span> while the panel is away.
    </p>
  </main>
</body>
</html>
