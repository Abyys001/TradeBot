# TradeBot — single compose file for dev (hot reload) and prod (RELOAD=0).
#
# Dev (default):  docker compose up --build
# Prod:           RELOAD=0 docker compose up -d --build
# Dashboard UI:  http://localhost:8080
# API direct:     http://localhost:8000

x-app-common: &app-common
  build: .
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://tradebot:tradebot@postgres:5432/tradebot
    REDIS_URL: redis://redis:6379/0
    RELOAD: ${RELOAD:-1}
    ALLOWED_HOSTS: localhost,127.0.0.1,web
    CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
  volumes:
    - .:/app
    - marketdata:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: tradebot
      POSTGRES_DB: tradebot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    <<: *app-common
    ports:
      - "8000:8000"
    command: >
      sh -c '
        if [ "$$RELOAD" = "1" ]; then
          watchfiles --filter python "daphne -b 0.0.0.0 -p 8000 config.asgi:application" /app
        else
          daphne -b 0.0.0.0 -p 8000 config.asgi:application
        fi
      '

  celery:
    <<: *app-common
    command: >
      sh -c '
        if [ "$$RELOAD" = "1" ]; then
          watchfiles --filter python "celery -A config worker --loglevel=info" /app
        else
          celery -A config worker --loglevel=info
        fi
      '

  celery-beat:
    <<: *app-common
    command: >
      sh -c '
        if [ "$$RELOAD" = "1" ]; then
          watchfiles --filter python "celery -A config beat --loglevel=info" /app
        else
          celery -A config beat --loglevel=info
        fi
      '

  market-feed:
    <<: *app-common
    command: >
      sh -c '
        if [ "$$RELOAD" = "1" ]; then
          watchfiles --filter python "python manage.py run_market_feed" /app
        else
          python manage.py run_market_feed
        fi
      '

  user-feed:
    <<: *app-common
    command: >
      sh -c '
        if [ "$$RELOAD" = "1" ]; then
          watchfiles --filter python "python manage.py run_user_feed" /app
        else
          python manage.py run_user_feed
        fi
      '

  candle-consumer:
    <<: *app-common
    command: >
      sh -c '
        if [ "$$RELOAD" = "1" ]; then
          watchfiles --filter python "python manage.py consume_hl_candles" /app
        else
          python manage.py consume_hl_candles
        fi
      '

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  marketdata:
