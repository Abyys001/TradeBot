# Production stack behind host nginx (TLS terminated on the host).
# nginx proxies /ws/ straight to backend and everything else to frontend.
#
#   docker compose up -d --build
#
# See docs/deploy.md for the full runbook.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walletmanager}
      POSTGRES_USER: ${POSTGRES_USER:-walletmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-walletmanager}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: >
      sh -c "python manage.py wait_for_db --timeout 30 &&
             python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: [.env]
    environment:
      USE_SQLITE: "false"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: backend,localhost,127.0.0.1,maxbot.cybercina.co.uk
      CORS_ALLOWED_ORIGINS: https://maxbot.cybercina.co.uk
      DJANGO_SECURE_SSL_REDIRECT: "false"
    ports: ["127.0.0.1:8001:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Keeps the platform's record and the exchanges' positions in agreement even
  # when no panel is open: a stop that fires at 3am has to free the account for
  # the next trade whether or not anyone is watching. Read-only against the
  # exchanges (get_position); it never places or cancels an order. The same
  # sweep also runs inline on every /positions/ poll, so this service being
  # down degrades latency, not correctness.
  possync:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: python manage.py sync_positions
    env_file: [.env]
    environment:
      USE_SQLITE: "false"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      NUXT_API_PROXY_TARGET: http://backend:8000/api
      NUXT_WS_PROXY_TARGET: ws://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
