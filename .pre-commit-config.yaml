# Pre-commit hooks. `docs/security-plan.md` §2 C.
#
#     pip install pre-commit && pre-commit install
#
# One hook here matters more than the rest: this working tree is one `.env`
# away from live trading credentials for real partner capital, and `gitleaks`
# is what turns "no key material in the repo" from a rule into a refusal. The
# CI job is the backstop; the hook is what stops the commit being made at all,
# because a key that reached the history is published whether or not it was
# reverted afterwards.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the same version as backend/requirements-dev.txt — a hook that
    # disagrees with CI about what is clean is a hook people uninstall.
    rev: v0.9.2
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^reference/
      - id: trailing-whitespace
        exclude: ^reference/
